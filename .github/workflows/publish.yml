name: Publish

on:
  push:
    tags:
      - "*.*.*"

jobs:
  test:
    permissions:
      id-token: write # Required for OIDC
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Publish
      run: ./scripts/publish.sh
